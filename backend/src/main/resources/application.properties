spring.application.name=settlehub-backend
app.version=@project.version@

# Default: in-memory H2 for local development.
# Set DATABASE_URL (e.g. a Neon connection string) to use PostgreSQL; see DatabaseUrlEnvironmentPostProcessor.
spring.datasource.url=jdbc:h2:mem:settlehub;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema is owned by Flyway (src/main/resources/db/migration).
# Existing 2.0 databases (created by Hibernate) are baselined at V1 and upgraded in place.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=64
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Security
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:2592000000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://localhost,capacitor://localhost,https://*.pages.dev}
app.rate-limit.auth-requests-per-minute=${APP_AUTH_RATE_LIMIT:10}
# auto = seed demo users only on the in-memory H2 database
app.seed-demo-data=${APP_SEED_DEMO_DATA:auto}
# Compressed receipt photos are stored as data URLs; ~350 KB keeps Neon's 0.5 GB free tier comfortable
app.receipts.max-chars=${APP_RECEIPT_MAX_CHARS:480000}

# Server
server.port=${PORT:8080}
server.shutdown=graceful
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.forward-headers-strategy=native
spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=false

# Mail client timeouts: fail fast (5s) instead of hanging on firewalled hosts (e.g. Render free tier)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Logging
logging.level.com.settlehub=INFO
logging.level.org.springframework.security=WARN
