spring.application.name=settlehub-backend

# Default H2 In-Memory DataSource (Overridden automatically by DatabaseUrlEnvironmentPostProcessor when DATABASE_URL is present)
spring.datasource.url=jdbc:h2:mem:settlehub;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:9a3f2c4e5b6a7d8e9f0123456789abcdef0123456789abcdef0123456789abcdef}
app.jwt.expiration-ms=86400000

# Server
server.port=${PORT:8080}

# Logging
logging.level.com.settlehub=INFO
logging.level.org.springframework.security=WARN
