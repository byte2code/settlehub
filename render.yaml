services:
  - type: web
    name: settlehub-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: settlehub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: settlehub-db
    plan: free
    databaseName: settlehub
    user: settlehub
